services:
  postgres:
    image: postgres:17-alpine
    container_name: jaankha-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jaankha}
      POSTGRES_USER: ${POSTGRES_USER:-jaankha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaankha}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jaankha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: jaankha-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jaankha}
      DATABASE_USERNAME: ${POSTGRES_USER:-jaankha}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-jaankha}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-720}
      RESET_TOKEN_TTL_MINUTES: ${RESET_TOKEN_TTL_MINUTES:-30}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@jaankha.sn}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-+221770000000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      UPLOAD_DIR: /app/uploads
      PRIVATE_UPLOAD_DIR: /app/private-uploads
    volumes:
      - jaankha_uploads:/app/uploads
      - jaankha_private_uploads:/app/private-uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  jaankha_postgres_data:
  jaankha_uploads:
  jaankha_private_uploads:
