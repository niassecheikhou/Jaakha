# Configuration des tests : base H2 en memoire, isolee de la base de developpement (./data/jaankha).
spring.datasource.url=jdbc:h2:mem:jaankha-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.upload.dir=target/test-uploads
app.private-upload.dir=target/test-private-uploads
app.cors.allowed-origin-patterns=http://localhost:*
app.frontend-url=http://localhost:5173
app.mail.from=no-reply@jaankha.test

# Aucun compte admin cree pendant les tests.
ADMIN_EMAIL=
ADMIN_PASSWORD=

# Serveur SMTP factice : aucun email n'est reellement envoye (les erreurs d'envoi sont journalisees).
spring.mail.host=localhost
spring.mail.port=1025
