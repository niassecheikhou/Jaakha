spring.application.name=jaakha-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jaakha}
spring.datasource.username=${DATABASE_USERNAME:jaakha}
spring.datasource.password=${DATABASE_PASSWORD:jaakha}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:720}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
app.mail.from=${MAIL_FROM:noreply@jaakha.local}
app.admin.bootstrap-email=${ADMIN_EMAIL:}
app.admin.bootstrap-phone=${ADMIN_PHONE:+221770000000}
app.admin.bootstrap-password=${ADMIN_PASSWORD:ChangeMe123!}
